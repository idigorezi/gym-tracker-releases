<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <title>Download GymTracker</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #f4f7f2; background: radial-gradient(ellipse at 50% 35%, #263326 0, #171e18 42%, #101510 78%);
    }
    main { width: min(100%, 440px); text-align: center; }
    .icon {
      width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 25px;
      border: 1px solid #ffffff1a; border-radius: 21px; color: #b7f36b; background: #b7f36b12;
      box-shadow: 0 12px 40px #0004;
    }
    .icon svg { width: 34px; height: 34px; }
    .eyebrow { color: #b7f36b; font-size: 12px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: clamp(36px, 9vw, 52px); letter-spacing: -.055em; line-height: 1.05; }
    p { margin: 0; color: #aab4aa; font-size: 16px; line-height: 1.6; }
    .download {
      display: flex; align-items: center; justify-content: center; gap: 10px; margin: 30px 0 16px;
      min-height: 56px; padding: 0 22px; border-radius: 14px; color: #172012; background: #b7f36b;
      font-size: 15px; font-weight: 800; text-decoration: none; transition: transform .18s, background .18s;
    }
    .download:hover { transform: translateY(-2px); background: #c7ff80; }
    .download:focus-visible, .release:focus-visible, .website:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .download svg { width: 19px; height: 19px; }
    .version { min-height: 20px; color: #899589; font-size: 13px; }
    .release { display: inline-block; margin-top: 26px; color: #c5d0c3; font-size: 13px; text-decoration-color: #667366; text-underline-offset: 4px; }
    .release:hover, .website:hover { color: #b7f36b; }
    .website { display: inline-block; margin-top: 14px; color: #899589; font-size: 13px; text-underline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8v8M4 9.5v5M17.5 8v8M20 9.5v5M6.5 12h11"/></svg>
    </div>
    <div class="eyebrow">Train smarter</div>
    <h1>GymTracker</h1>
    <p>Your workouts, progress, and goals—all in one place.</p>
    <a class="download" id="download" href="https://github.com/idigorezi/gym-tracker-releases/releases/latest/download/GymTrackerSetup.exe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg>
      Download for Windows
    </a>
    <div class="version" id="version" aria-live="polite">Getting the latest version…</div>
    <a class="release" href="https://github.com/idigorezi/gym-tracker-releases/releases/latest">Release notes</a>
    <br>
    <a class="website" href="https://ryenbytes.com">ryenbytes.com</a>
  </main>
  <script>
    fetch('https://api.github.com/repos/idigorezi/gym-tracker-releases/releases/latest')
      .then(response => { if (!response.ok) throw new Error('Release unavailable'); return response.json(); })
      .then(release => {
        const installer = release.assets?.find(asset => asset.name === 'GymTrackerSetup.exe');
        if (installer) document.getElementById('download').href = installer.browser_download_url;
        document.getElementById('version').textContent = `Latest release: ${release.tag_name}`;
      })
      .catch(() => { document.getElementById('version').textContent = 'Latest Windows installer'; });
  </script>
</body>
</html>
